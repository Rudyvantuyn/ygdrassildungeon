services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ygdrassil
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PORT: 3000
      CORS_ORIGIN: http://localhost:8080
      DATABASE_URL: postgres://postgres:postgres@db:5432/ygdrassil
    ports:
      - "3000:3000"
    depends_on:
      - db

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  pgdata:
